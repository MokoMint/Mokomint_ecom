name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.set-artifact.outputs.artifact-name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'next-app/package-lock.json'

      - name: Install dependencies
        working-directory: './next-app'
        run: npm ci

      - name: Build Next.js app
        working-directory: './next-app'
        run: npm run build

      - name: Package deployment artifact
        working-directory: './next-app'
        run: |
          rm -f ../deployment-package.zip
          zip -r ../deployment-package.zip . -x "node_modules/*" ".git/*"

      - name: Set artifact name
        id: set-artifact
        run: echo "artifact-name=app-service-${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact.outputs.artifact-name }}
          path: deployment-package.zip
          if-no-files-found: error
          retention-days: 60

  approval:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production

    steps:
      - name: Manual Approval Confirmed
        run: echo "✅ Deployment approved and proceeding to Azure App Service"

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, approval]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ./artifact

      - name: Debug - Check secrets
        run: |
          echo "AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}"
          echo "AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP_DEV }}"
          echo "AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_DEV }}"

      - name: Azure CLI Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        run: |
          az webapp deploy \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_DEV }} \
            --name ${{ secrets.AZURE_WEBAPP_NAME_DEV }} \
            --src-path ./artifact/deployment-package.zip \
            --type zip

      - name: Logout from Azure
        run: az logout

      - name: Deployment Summary
        if: success()
        run: |
          echo "========================================"
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "========================================="
          echo "Web App: ${{ secrets.AZURE_WEBAPP_NAME_DEV }}"
          echo "Resource Group: ${{ secrets.AZURE_RESOURCE_GROUP_DEV }}"
          echo "Deployment ID: ${{ github.run_id }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "========================================="
